# Quantumult X 广告净化整合订阅 | v1.1.0 | 2026-11-22

# 仅含广告净化规则；不含会员解锁功能、节点订阅、MITM 私钥或账号凭据。
# 已保留所选上游模块的启用规则，并剔除彩云 biz.cyapi.cn 会员相关规则。
# YouTube 使用带 Shorts 隐藏开关的本地适配脚本；地图、Keep、B站、小红书、彩云天气和 12306 保留必要上游脚本依赖。
# 主配置须保留直连例外：host, ad.12306.cn, direct；host-suffix, optimus-ads.amap.com, direct。导入后停用重复的本地 12306 重写。
# 本文件是 Quantumult X 原生 rewrite_remote 格式；添加到 [rewrite_remote] 时使用 opt-parser=false。
# 上游规则来源及脚本依赖均见各条规则 URL。

hostname = -redirector*.googlevideo.com, *.googlevideo.com, www.youtube.com, s.youtube.com, youtubei.googleapis.com, m5.amap.com, m5-zb.amap.com, center.amap.com, amap-aos-info-nogw.amap.com, ai.amap.com, amdc.m.taobao.com, hc-ssp.sm.cn, api.gotokeep.com, 42.187.199.248, kad.gotokeep.com, app.bilibili.com, app.biliapi.net, grpc.biliapi.net, grpc.bilibili.com, api.bilibili.com, api.bilibili.net, api.biliapi.com, api.biliapi.net, *.xiaohongshu.com, api.xiaoyuzhoufm.com, 118.31.123.175, 112.124.203.116, 118.31.125.171, 47.57.181.112, 47.57.182.96, wrapper.cyapi.cn, api.caiyunapp.com, starplucker.cyapi.cn, ad.cyapi.cn, ad.12306.cn

# ---- YouTube ----
# Source: https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) url 302 $1$2$3
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad url reject-200
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|guide|account\/get_setting|get_watch) url script-response-body https://raw.githubusercontent.com/wenxiaoa/QuantumultX/refs/heads/master/YouTubeShorts.js
# Shorts: hide the Guide entry and block the Shorts-only playback feed and direct Shorts page.
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/reel\/reel_watch_sequence(?:\?.*)?$ url reject-200
^https?:\/\/www\.youtube\.com\/shorts(?:\/[^?]*)?(?:\?.*)?$ url reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads url reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) url reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext url reject-200

