# 微博净化 · wenxiaoa
# Version: 1.0.2
# 国内版 + 国际版；默认保留原版强力净化范围。
# 文档: https://github.com/wenxiaoa/QuantumultX/tree/master/Weibo
# 引用接口研究: ddgksf2013 / zmqcherish，详见 Weibo/README.md。
# 启用重写和 MITM，安装并信任自己的证书；关闭 QX 兼容性增强。
# 请停用其他微博重写，避免同一响应被多次处理。
# 配套分流订阅: https://raw.githubusercontent.com/wenxiaoa/QuantumultX/master/Weibo/WeiboAds.list
# 在重写资源中添加本文件，无需资源解析器。

hostname = api.weibo.*, *.api.weibo.*, mapi.weibo.*, *.uve.weibo.com, new.vip.weibo.cn, boot.biz.weibo.com

# suggestions
^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/statuses/container_positive(?:\?|$) url reject-200
# push-popup
^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/push/info(?:\?|$) url reject-200
# interest-tags
^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/(?:[^?]*/)?account/recommend_interesttags(?:\?|$) url reject-dict
# live-tab
^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/(?:[^?]*/)?media_homelist(?:\?|$) url reject-200
# search-placeholder
^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/(?:[^?]*/)?finder/searchbarchange(?:\?|$) url reject-200
