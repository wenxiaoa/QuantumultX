^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/hot/hours_spotlight(?:\?|$) url reject-dict
# intl-video
^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/cardlist\?(?=[^#]*\bv_f=[^&]*Weibo_intl) url reject-dict
# intl-hot-users
^https?://weibointl\.api\.weibo\.(?:cn|com)/portal\.php\?(?:[^#]*&)?a=hot_search_users(?:&|$) url reject-dict
