^https?://(?:m?api|[a-z0-9-]+\.api)\.weibo\.(?:cn|com)/\d+/profile/recommend_popuser(?:\?|$) url reject-dict
# boot-realtime
^https?://boot[^/]*\.weibo\.com/v\d+/ad/realtime(?:\?|$) url reject-200
