# 哔哩哔哩净化 | v1.0.0 | Quantumult X
# 添加到重写资源并关闭资源解析器。

hostname = app.bilibili.com, app.biliapi.net, app.biliapi.com, api.bilibili.com, api.bilibili.net, api.biliapi.com, api.biliapi.net

# ---- 哔哩哔哩 ----
# Source: https://ddgksf2013.top/rewrite/BiliBiliAdsLite.conf
# 播放页规则参考墨鱼完整版和 Biliverse/ADBlock v0.7.5。
# 评论与播放页可共用原生 gRPC 域名，本订阅只在已解密的连接上重写播放页。
# Video playback lower product promotions: the full source's ad-card response filter.
^https?:\/\/api\.bili(api|bili)\.(net|com)\/pgc\/season\/app\/related\/recommend\? url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
# 普通视频详情、相关推荐分页、异步广告。仅处理列出的接口。
^https?://(?:app\.bilibili\.com|app\.biliapi\.(?:com|net)|grpc\.biliapi\.net|grpc\.bilibili\.com)(?::443)?/bilibili\.app\.(?:view\.v1\.View/(?:View|TFInfo|RelatesFeed|PlayerRelates|ContinuousPlay|ViewProgress)|viewunite\.v1\.View/(?:View|RelatesFeed|AIRelateAsync|ViewProgress|PlayPause|ViewEndPage)|playerunite\.v1\.Player/PlayViewUnite)(?:\?|$) url script-response-body https://raw.githubusercontent.com/wenxiaoa/QuantumultX/refs/heads/master/Bilibili/video-page-v1.js
# JSON 视频详情及竖屏相关推荐。首页和关注流各走原处理器。
^https?://(?:app\.bilibili\.com|app\.biliapi\.(?:com|net))(?::443)?/x/v2/(?:view|feed/index/relate/story)/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/wenxiaoa/QuantumultX/refs/heads/master/Bilibili/video-page-v1.js
^https?://api\.(?:bilibili\.com|biliapi\.net)(?::443)?/x/web-interface/(?:archive/related|view/detail)/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/wenxiaoa/QuantumultX/refs/heads/master/Bilibili/video-page-v1.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/show url reject-200
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/myinfo\? url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index(?:\/story)?(?:\?|$) url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
^https?:\/\/app\.bilibili\.com\/x\/resource\/show\/tab url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/mine url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
^https?:\/\/app\.bilibili\.com\/x\/resource\/top\/activity url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
^https?:\/\/app\.bilibili\.com\/x\/v2\/search\/square url script-response-body https://ddgksf2013.top/scripts/bilibili.ads.js
